<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Dark Forum</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #bb86fc;
            --accent-hover: #9c27b0;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px; margin: 0 auto; padding: 20px;
        }
        h1 { text-align: center; color: var(--accent); }
        .form-container, .post {
            background-color: var(--card-bg); border-radius: 8px;
            padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, textarea {
            width: 100%; padding: 10px; margin-bottom: 10px;
            background-color: #2c2c2c; border: 1px solid #444; color: white;
            border-radius: 4px; box-sizing: border-box;
        }
        button {
            background-color: var(--accent); color: black; border: none;
            padding: 10px 20px; font-weight: bold; border-radius: 4px;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { background-color: var(--accent-hover); color: white; }
        .post-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .post-title { font-size: 1.2em; font-weight: bold; margin: 0; }
        .post-author { color: var(--text-muted); font-size: 0.9em; }
        .post-tag { color: var(--accent); font-size: 0.9em; }
        .post-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .like-btn { background-color: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .like-btn:hover { background-color: var(--accent); color: black; }
    </style>
</head>
<body>

    <h1>[ Dark Forum ]</h1>

    <div class="form-container">
        <input type="text" id="author" placeholder="Твой никнейм" required>
        <input type="text" id="title" placeholder="Заголовок поста" required>
        <input type="text" id="tag" placeholder="#ТвойТег" required>
        <textarea id="content" rows="4" placeholder="О чем хочешь рассказать?" required></textarea>
        <button onclick="submitPost()">Опубликовать</button>
    </div>

    <div id="posts-container">
        </div>

    <script>
        async function loadPosts() {
            const res = await fetch('/api/posts');
            if (res.ok) {
                const posts = await res.json();
                const container = document.getElementById('posts-container');
                container.innerHTML = '';
                posts.forEach(post => {
                    container.innerHTML += `
                        <div class="post">
                            <div class="post-header">
                                <div>
                                    <p class="post-title">${post.title}</p>
                                    <span class="post-author">@${post.author}</span>
                                </div>
                                <span class="post-tag">${post.tag.startsWith('#') ? post.tag : '#' + post.tag}</span>
                            </div>
                            <p>${post.content}</p>
                            <div class="post-footer">
                                <button class="like-btn" onclick="likePost(${post.id})">👍 Лайк (${post.likes})</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        async function submitPost() {
            const data = {
                author: document.getElementById('author').value,
                title: document.getElementById('title').value,
                tag: document.getElementById('tag').value,
                content: document.getElementById('content').value
            };
            if (!data.author || !data.title || !data.content) return alert("Заполни все поля!");

            await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            loadPosts();
        }

        async function likePost(id) {
            await fetch(`/api/posts/${id}/like`, { method: 'POST' });
            loadPosts();
        }

        // Загружаем посты при старте
        loadPosts();
    </script>
</body>
</html>
