apiVersion: v1
kind: Pod
metadata:
  name: db-client
spec:
  containers:
    - name: psql
      image: postgres:18.6-alpine
      command: ["sleep", "3600"]
      env:
        - name: PGHOST
          value: "postgres"
        - name: PGDATABASE
          value: "shop"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: db-auth
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db-auth
              key: password
