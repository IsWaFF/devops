apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  DATABASE_HOST: "postgres.database"
  DATABASE_PORT: "5432"
---
apiVersion: v1
kind: Pod
metadata:
  name: db-client
spec:
  containers:
    - name: db-client
      image: busybox:1.38
      command:
        [
          "sh",
          "-c",
          "echo connecting to $DATABASE_HOST:$DATABASE_PORT; sleep 3600",
        ]
      envFrom:
        - configMapRef:
            name: db-config
