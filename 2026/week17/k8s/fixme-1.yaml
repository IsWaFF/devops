apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-app
  template:
    metadata:
      labels:
        app: slow-app
    spec:
      containers:
        - name: app
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              echo "starting... this app needs 40 seconds to warm up"
              sleep 40
              mkdir -p /www && echo "slow-app is up" > /www/index.html
              echo "ready, serving on :8080"
              exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 41
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
