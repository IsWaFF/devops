# The Secret was made by a teammate with:  echo 'k8s-is-fun-2026' | base64
apiVersion: v1
kind: Secret
metadata:
  name: app-db
type: Opaque
stringData:
  username: shop
  password: k8s-is-fun-2026
---
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
    - name: app
      image: postgres:18.6-alpine
      command: ["sh", "-c"]
      args:
        - |
          until psql -c 'select 1' >/dev/null; do echo "login failed, retry in 5s"; sleep 5; done
          echo "connected!"
          sleep 3600
      env:
        - name: PGHOST
          value: "postgres"
        - name: PGDATABASE
          value: "shop"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: app-db
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db
              key: password
