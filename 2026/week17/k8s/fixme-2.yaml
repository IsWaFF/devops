apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              echo "loading 60 MB of cache into memory..."
              dd if=/dev/zero of=/dev/shm/cache bs=1M count=60 2>/dev/null
              echo "cache loaded, serving"
              sleep 3600
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "128Mi"
