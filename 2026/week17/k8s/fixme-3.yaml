apiVersion: v1
kind: Namespace
metadata:
  name: billing
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: billing-quota
  namespace: billing
spec:
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.memory: "2Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoices
  namespace: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: invoices
  template:
    metadata:
      labels:
        app: invoices
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
