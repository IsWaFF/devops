apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy2
  labels:
    app: proxy2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy2
  template:
    metadata:
      labels:
        app: proxy2
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx
      volumes:
        - name: config
          configMap:
            name: nginx-config
