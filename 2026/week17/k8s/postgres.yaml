apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "shop"
            - name: POSTGRES_USER # 1) a Secret key as an env variable
              valueFrom:
                secretKeyRef:
                  name: db-auth
                  key: username
            - name: POSTGRES_PASSWORD_FILE # 2) a Secret as a file (read by the postgres image)
              value: /run/secrets/db/password
          volumeMounts:
            - name: db-auth
              mountPath: /run/secrets/db
              readOnly: true
      volumes:
        - name: db-auth
          secret:
            secretName: db-auth
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
