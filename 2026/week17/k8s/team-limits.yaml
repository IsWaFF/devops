apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: team-a
spec:
  limits:
    - type: Container
      defaultRequest:        # used when a container has no requests
        cpu: "100m"
        memory: "64Mi"
      default:               # used when a container has no limits
        cpu: "200m"
        memory: "128Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-a-quota
  namespace: team-a
spec:
  hard:
    pods: "3"
    requests.cpu: "1"
    requests.memory: "512Mi"
