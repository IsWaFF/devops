apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.38
          env:
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["sh", "-c", "trap 'exit 0' TERM; echo \"agent running on $NODE\"; while true; do sleep 1; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
