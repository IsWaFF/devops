apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    app: database
  ports:
    - port: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  initContainers:
    - name: wait-for-db
      image: busybox:1.38
      command: ["sh", "-c"]
      args:
        - |
          until nslookup database.default.svc.cluster.local >/dev/null 2>&1; do
            echo "waiting for the database service..."
            sleep 2
          done
  containers:
    - name: api
      image: busybox:1.38
      command: ["sh", "-c", "echo api is running; sleep 3600"]
