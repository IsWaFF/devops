apiVersion: v1
kind: Pod
metadata:
  name: init-demo
spec:
  initContainers:
    - name: wait-for-backend          # 1) wait until the Service "backend" exists
      image: busybox:1.38
      command: ["sh", "-c"]
      args:
        - |
          until nslookup backend.default.svc.cluster.local >/dev/null 2>&1; do
            echo "waiting for backend..."
            sleep 2
          done
          echo "backend found"
    - name: make-page                 # 2) prepare a file for the app
      image: busybox:1.38
      command: ["sh", "-c", "echo \"<h1>Made by an init container at $(date)</h1>\" > /work/index.html"]
      volumeMounts:
        - name: html
          mountPath: /work
  containers:
    - name: web                       # 3) the app starts only after both init containers succeeded
      image: nginx:1.30-alpine
      volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html
      emptyDir: {}
