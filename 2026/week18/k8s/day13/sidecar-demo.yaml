apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
spec:
  initContainers:
    - name: log-shipper               # a native sidecar: an init container that keeps running
      image: busybox:1.38
      restartPolicy: Always
      command: ["sh", "-c", "tail -F /logs/access.log"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  containers:
    - name: web
      image: nginx:1.30-alpine
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx   # nginx writes access.log here, into the shared volume
  volumes:
    - name: logs
      emptyDir: {}
