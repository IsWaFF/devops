apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: uploader
spec:
  containers:
    - name: uploader
      image: busybox:1.38
      command:
        [
          "sh",
          "-c",
          "trap 'exit 0' TERM; echo uploads go to /uploads; while true; do sleep 1; done",
        ]
      volumeMounts:
        - name: uploads
          mountPath: /uploads
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: shared
