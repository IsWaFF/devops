apiVersion: v1
kind: Service
metadata:
  name: cache
spec:
  clusterIP: None
  selector:
    app: cache
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
spec:
  serviceName: cache
  replicas: 3
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: cache
          image: busybox:1.38
          command:
            [
              "sh",
              "-c",
              'mkdir -p /www && echo "cache node $HOSTNAME" > /www/index.html && exec httpd -f -p 8080 -h /www',
            ]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
