apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None            # headless: gives every Pod its own DNS name
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web           # the headless Service above
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: init-page    # writes a page only if the volume is new
          image: busybox:1.38
          command: ["sh", "-c", "[ -f /www/index.html ] || echo \"Hello from $HOSTNAME, page created $(date +%H:%M:%S)\" > /www/index.html"]
          volumeMounts:
            - name: www
              mountPath: /www
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:      # one PVC per Pod: www-web-0, www-web-1, ...
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Mi
