apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: busybox:1.38
          command:
            [
              "sh",
              "-c",
              "echo 'running database migrations...'; sleep 3; echo 'migrations done'",
            ]
