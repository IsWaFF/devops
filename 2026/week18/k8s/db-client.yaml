apiVersion: v1
kind: Pod
metadata:
  name: db-client
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:18.6-alpine
      ports:
        - name: postgres
          containerPort: 5432
      command: ["sleep", "3600"]
      env:
        - name: PGDATABASE
          value: "shop"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: db-auth
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db-auth
              key: password
        - name: PGHOST
          value: "postgres-0.postgres"
