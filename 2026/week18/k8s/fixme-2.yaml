apiVersion: v1
kind: Pod
metadata:
  name: shipper
spec:
  initContainers:
    - name: log-shipper
      image: busybox:1.38
      restartPolicy: Always
      command: ["sh", "-c", "tail -F /logs/acces.log"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  containers:
    - name: web
      image: nginx:1.30-alpine
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
  volumes:
    - name: logs
      emptyDir: {}
