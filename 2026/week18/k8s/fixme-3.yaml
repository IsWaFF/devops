# A teammate "rotated" the database password: a new Secret with a new password,
# then "kubectl delete pod postgres-0" so that Postgres picks it up.
apiVersion: v1
kind: Secret
metadata:
  name: db-auth
type: Opaque
stringData:
  username: shop
  password: new-password-2026
---
apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
    - name: app
      image: postgres:18.6-alpine
      command: ["sh", "-c"]
      args:
        - |
          until psql -c 'select 1' >/dev/null; do echo "login failed, retry in 5s"; sleep 5; done
          echo "connected!"
          sleep 3600
      env:
        - name: PGHOST
          value: "postgres-0.postgres"
        - name: PGDATABASE
          value: "shop"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: db-auth
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db-auth
              key: password
