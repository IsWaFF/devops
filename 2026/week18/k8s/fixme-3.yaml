apiVersion: v1
kind: ConfigMap
metadata:
  name: import-data
data:
  data.csv: |
    id,name
    1,alice
    2,bob
    3,carol
---
apiVersion: batch/v1
kind: Job
metadata:
  name: import
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: import
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              set -eo pipefail
              echo "importing /data/data.csv ..."
              rows=$(tail -n +2 /data/data.csv | wc -l)
              echo "imported $rows rows"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          configMap:
            name: import-data
