apiVersion: batch/v1
kind: Job
metadata:
  name: thumbnails
spec:
  completionMode: Indexed
  completions: 6 # the Job is done after 6 successful Pods
  parallelism: 2 # at most 2 Pods at the same time
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.38
          command:
            [
              "sh",
              "-c",
              'echo "task № $JOB_COMPLETION_INDEX completed"; sleep 4',
            ]
