apiVersion: v1
kind: ConfigMap
metadata:
  name: lab3-pages
data:
  index.html: |
    metastate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab3
  template:
    metadata:
      labels:
        app: lab3
    spec:
      containers:
        - name: web
          image: nginx:1.30-alpine
          volumeMounts:
            - name: pages
              mountPath: /usr/share/nginx/html
      volumes:
        - name: pages
          configMap:
            name: lab3-pages
