apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: site
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      name: site
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: site
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: site
