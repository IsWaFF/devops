apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab1
  template:
    metadata:
      labels:
        app: lab1
        version: v2
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: lab1
spec:
  selector:
    app: lab1
    version: v2
  ports:
    - port: 80
      targetPort: http
