apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab2
  template:
    metadata:
      labels:
        app: lab2
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: lab2
spec:
  selector:
    app: lab2
  ports:
    - port: 8080
      targetPort: http
