apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab6
  template:
    metadata:
      labels:
        app: lab6
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: lab6
spec:
  selector:
    app: lab6
  ports:
    - port: 80
      targetPort: http
