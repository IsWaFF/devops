# Two teams, two namespaces:
#   lab7-api: the API (podinfo) behind the Service "api"
#   lab7-web: an nginx proxy "web" that forwards every request to the API
apiVersion: v1
kind: Namespace
metadata:
  name: lab7-api
---
apiVersion: v1
kind: Namespace
metadata:
  name: lab7-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: lab7-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lab7-api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-conf
  namespace: lab7-web
data:
  default.conf: |
    server {
      listen 80;
      location / {
        proxy_connect_timeout 5s;
        proxy_pass http://api.lab7-api.svc.cluster.local/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab7-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: web-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab7-web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
