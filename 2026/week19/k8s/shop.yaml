# The worked example: the shop answers only inside its own Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: busybox:1.38
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /www && echo "shop is open" > /www/index.html
              trap 'exit 0' TERM
              httpd -f -p 127.0.0.1:8080 -h /www &
              wait
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8080
