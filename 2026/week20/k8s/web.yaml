apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # A fixed ClusterIP (normally Kubernetes picks one). Today we need to know it
  # even at a moment when kubectl can't tell us anything.
  clusterIP: 10.96.0.200
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
