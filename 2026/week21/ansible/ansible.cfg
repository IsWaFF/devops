# Настройки Ansible для стенда. Ansible берёт ansible.cfg из папки, в которой его запускают,
# поэтому все команды запускай отсюда.

[defaults]
# инвентарь по умолчанию, чтобы не писать -i inventory.ini в каждой команде
inventory = inventory.ini

# ключ, которым Ansible входит на серверы стенда. Его создаёт ./lab.sh up
private_key_file = lab/key

# серверы стенда пересоздаются, и их ssh-ключи меняются. На настоящих серверах так не делают
host_key_checking = False

# какой python запускать на сервере. Без этой строки Ansible ищет его сам и пишет об этом в каждом ответе
interpreter_python = /usr/bin/python3

# результаты и ошибки печатать как YAML, а не одной длинной строкой JSON
callback_result_format = yaml

# блок 6: файл с паролем от vault
# vault_password_file = .vault_pass

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR

# меньше ssh-операций на задачу, плейбуки идут заметно быстрее
pipelining = True
