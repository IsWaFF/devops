- name: Heartbeat service unit
  ansible.builtin.template:
    src: heartbeat.service.j2
    dest: /etc/systemd/system/heartbeat.service
    mode: "0644"

- name: Heartbeat timer unit
  ansible.builtin.template:
    src: heartbeat.timer.j2
    dest: /etc/systemd/system/heartbeat.timer
    mode: "0644"
  notify: restart heartbeat timer

- name: Timer is running and starts on boot
  ansible.builtin.systemd_service:
    name: heartbeat.timer
    state: started
    enabled: true
    daemon_reload: true
