- name: Web servers
  hosts: web
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Nginx service
      ansible.builtin.service:
        name: nginx
        enabled: true

    - name: Get index.html
      ansible.builtin.copy:
        mode: "0644"
        src: file/index.html
        dest: /var/www/html/index.html
