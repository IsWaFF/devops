<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SHADOWBOX TERMINAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            background-color: #000;
            color: #0f0;
            font-family: 'VT323', monospace;
            font-size: 24px;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 5px #0f0;
            overflow: hidden;
        }

        /* Эффект старого монитора (сканлайн) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal {
            width: 700px;
            border: 2px solid #0f0;
            padding: 30px;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 20px #0f0;
        }

        h1 { margin-top: 0; text-transform: uppercase; letter-spacing: 5px; border-bottom: 1px dashed #0f0; padding-bottom: 10px; }
        
        input, textarea {
            background: black;
            border: none;
            color: #0f0;
            font-family: 'VT323', monospace;
            font-size: 24px;
            width: 100%;
            outline: none;
            resize: none;
            margin-top: 10px;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 24px;
            padding: 5px 20px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        button:hover { background: #cfc; }

        .hidden { display: none; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .result-box { margin-top: 20px; border: 1px solid #0f0; padding: 10px; word-break: break-all;}
    </style>
</head>
<body>
    <div class="terminal">
        <h1>> SHADOWBOX_SYSTEM v1.0</h1>
        
        <div id="menu">
            <p>Выберите действие:</p>
            <p>[1] ЗАШИФРОВАТЬ СООБЩЕНИЕ</p>
            <p>[2] ПОЛУЧИТЬ ДАННЫЕ</p>
            <br>
            <span>root@shadowbox:~$ </span>
            <input type="text" id="cmd-input" autofocus placeholder="_">
        </div>

        <div id="create-screen" class="hidden">
            <p>> Введите секретные данные:</p>
            <textarea id="secret-text" rows="4" placeholder="Текст сообщения..."></textarea>
            <button onclick="sendData()">[ ЗАГРУЗИТЬ В СЕТЬ ]</button>
            <button onclick="goHome()" style="background: transparent; color: #0f0; border: 1px solid #0f0;">[ ОТМЕНА ]</button>
        </div>

        <div id="read-screen" class="hidden">
            <p>> Введите ID транзакции:</p>
            <input type="text" id="secret-id" placeholder="Например: a1b2c3d4">
            <button onclick="readData()">[ ДЕШИФРОВАТЬ ]</button>
            <button onclick="goHome()" style="background: transparent; color: #0f0; border: 1px solid #0f0;">[ ОТМЕНА ]</button>
        </div>

        <div id="output" class="hidden">
            <div class="result-box" id="output-content"></div>
            <p onclick="goHome()" style="cursor: pointer; text-decoration: underline; margin-top: 15px;">[ ВЕРНУТЬСЯ В ТЕРМИНАЛ ]</p>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000';

        // Логика переключения экранов
        const cmdInput = document.getElementById('cmd-input');
        cmdInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const val = cmdInput.value;
                if (val === '1') showScreen('create-screen');
                else if (val === '2') showScreen('read-screen');
                else {
                    cmdInput.value = '';
                    cmdInput.placeholder = 'Ошибка. Введите 1 или 2';
                }
            }
        });

        function showScreen(id) {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('create-screen').classList.add('hidden');
            document.getElementById('read-screen').classList.add('hidden');
            document.getElementById('output').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function goHome() {
            cmdInput.value = '';
            cmdInput.placeholder = '_';
            showScreen('menu');
            setTimeout(() => cmdInput.focus(), 100);
        }

        async function sendData() {
            const text = document.getElementById('secret-text').value;
            if(!text) return;
            
            try {
                const res = await fetch(`${API}/create`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text})
                });
                const data = await res.json();
                showScreen('output');
                document.getElementById('output-content').innerHTML = `
                    <p>СТАТУС: СОХРАНЕНО</p>
                    <p>ID ДОСТУПА: <span style="color: white; background: green; padding: 0 5px;">${data.id}</span></p>
                    <p style="color: #666">// Запишите ID. После прочтения данные исчезнут.</p>
                `;
                document.getElementById('secret-text').value = '';
            } catch(e) { alert('ОШИБКА СЕТИ'); }
        }

        async function readData() {
            const id = document.getElementById('secret-id').value;
            if(!id) return;

            try {
                const res = await fetch(`${API}/read/${id}`);
                const data = await res.json();
                showScreen('output');
                
                if (data.error) {
                    document.getElementById('output-content').innerHTML = `<p style="color: red">ОШИБКА: ${data.error}</p>`;
                } else {
                    document.getElementById('output-content').innerHTML = `
                        <p>ВХОДЯЩЕЕ СООБЩЕНИЕ:</p>
                        <p style="color: white">${data.message}</p>
                        <br>
                        <p style="border-top: 1px dashed #0f0; padding-top: 10px;">СТАТУС: <span class="blink">УДАЛЕНО ИЗ БД</span></p>
                    `;
                }
                document.getElementById('secret-id').value = '';
            } catch(e) { alert('ОШИБКА СЕТИ'); }
        }
    </script>
</body>
</html>
