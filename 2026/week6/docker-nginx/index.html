<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsWaFF | DevOps Engineer</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --secondary: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            margin-bottom: 1.5rem;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        .role {
            color: var(--accent);
            font-weight: 500;
            margin-top: 0.5rem;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .link-card:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .discord-tag {
            font-size: 0.9rem;
            color: var(--secondary);
            margin-top: 1rem;
            display: block;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="avatar.png" alt="IsWaFF Avatar" class="avatar">
        
        <h1>IsWaFF</h1>
        <div class="role">Beginner DevOps Engineer</div>

        <div class="links">
            <a href="https://github.com/IsWaFF" target="_blank" class="link-card">
                GitHub Profile
            </a>
        </div>

        <span class="discord-tag">Discord: <b>apbyzov</b></span>

        <footer>
            &copy; 2026 IsWaFF. Build with 💙
        </footer>
    </div>

</body>
</html>
